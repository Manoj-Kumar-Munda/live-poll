name: Backend Deploy

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          envs: PORT,MONGODB_URI,BETTER_AUTH_SECRET,BETTER_AUTH_URL,CLIENT_URL,CORS_ORIGIN,RESEND_API_KEY,RESEND_FROM_EMAIL
          script_stop: true
          script: |
            set -euo pipefail
            REPO_DIR=/opt/live-poll

            if [ -d "$REPO_DIR/.git" ]; then
              echo "Pulling latest changes..."
              git -C "$REPO_DIR" pull origin master
            else
              echo "Cloning repository..."
              git clone ${{ secrets.REPO_URL }} "$REPO_DIR"
            fi

            cd "$REPO_DIR/backend"

            echo "Creating .env file..."
            if [ ! -f .env ]; then
              echo "File does not exist, creating..."
              touch .env
            fi

            echo "NODE_ENV=production" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env
            echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}" >> .env

            chmod 600 .env

            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
