name: Backend Deploy

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          envs: PORT,MONGODB_URI,BETTER_AUTH_SECRET,BETTER_AUTH_URL,CLIENT_URL,CORS_ORIGIN,RESEND_API_KEY,RESEND_FROM_EMAIL
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "Installing Node.js and npm..."
              if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.2/install.sh | bash
                . "$NVM_DIR/nvm.sh"
              fi
              nvm install 24
            else
              echo "Node.js $(node -v) and npm $(npm -v) already installed"
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2 for current user..."
              npm install -g pm2
            else
              echo "PM2 $(pm2 -v) already installed"
            fi

            if [ -d "live-poll/backend" ]; then
              echo "Repository exists, pulling latest changes..."
              cd live-poll/backend
              git pull origin master
            else
              echo "Cloning repository..."
              git clone ${{ secrets.REPO_URL }}
              cd live-poll/backend
            fi

            echo "Creating .env file..."
            if [ ! -f .env ]; then
              echo "File does not exist, creating..."
              touch .env
            fi

            echo "NODE_ENV=production" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env
            echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}" >> .env

            chmod 600 .env

            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
