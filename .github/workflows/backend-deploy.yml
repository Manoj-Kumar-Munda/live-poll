name: Backend Deploy

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            cd /root
            if [ -d "live-poll" ]
            then
              cd "live-poll"
              git pull origin master
            else
              git clone https://github.com/${{ github.repository }}.git live-poll
              cd live-poll
            fi
            cd backend
            echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" > .env
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> .env
            echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}" >> .env
            npm install --legacy-peer-deps
            npm run build
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
