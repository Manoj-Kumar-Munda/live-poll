name: Backend Deploy

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          script_stop: true
          request_pty: true
          script: |
            set -x
            echo "SSH OK"
            echo "user=$(whoami) home=$HOME pwd=$(pwd)"
            command -v git || echo "WARN: git missing"
            command -v node || echo "WARN: node missing"
            command -v npm || echo "WARN: npm missing"
            command -v pm2 || echo "WARN: pm2 missing"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          command_timeout: 30m
          debug: true
          request_pty: true
          script_stop: true
          script: |
            set -ex
            echo "=== Deploy started ==="
            echo "user=$(whoami) home=$HOME pwd=$(pwd)"

            REPO_DIR="$HOME/live-poll"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            echo "repo_dir=$REPO_DIR repo_url=$REPO_URL"

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            command -v git >/dev/null 2>&1 || { echo "ERROR: git is not installed"; exit 1; }
            command -v node >/dev/null 2>&1 || { echo "ERROR: node is not installed"; exit 1; }
            command -v npm >/dev/null 2>&1 || { echo "ERROR: npm is not installed"; exit 1; }
            command -v pm2 >/dev/null 2>&1 || { echo "ERROR: pm2 is not installed (npm install -g pm2)"; exit 1; }

            echo "node=$(node -v) npm=$(npm -v) pm2=$(pm2 -v)"

            if [ -d "$REPO_DIR/.git" ]; then
              echo "Pulling latest changes..."
              git -C "$REPO_DIR" pull origin master
            else
              echo "Cloning repository..."
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR/backend"
            echo "backend_dir=$(pwd)"

            {
              echo "NODE_ENV=production"
              echo "PORT=${{ secrets.PORT }}"
              echo "MONGODB_URI=${{ secrets.MONGODB_URI }}"
              echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}"
              echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}"
              echo "CLIENT_URL=${{ secrets.CLIENT_URL }}"
              echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}"
              echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
              echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}"
            } > .env
            chmod 600 .env

            echo "Installing dependencies..."
            npm ci

            echo "Building..."
            npm run build

            echo "Restarting PM2..."
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save

            echo "=== Deploy finished ==="
